[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
# Equivalent of forge coverage --ir-minimum (what script/gains-coverage.sh uses): via_ir with the
# optimizer sequence emptied, stack allocation on. Fast compile, avoids stack-too-deep.
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }, { access = "read-write", path = "./test/fixtures" }]

[profile.default.optimizer_details]
peephole = false
inliner = false
jumpdestRemover = false
orderLiterals = false
deduplicate = false
cse = false
constantOptimizer = false
yul = true

[profile.default.optimizer_details.yulDetails]
stackAllocation = true
optimizerSteps = ""

[fuzz]
runs = 64

[invariant]
runs = 16
depth = 32

[lint]
lint_on_build = false
